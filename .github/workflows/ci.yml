name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sabor
          POSTGRES_PASSWORD: sabor_ci
          POSTGRES_DB: sabor_caseiro
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U sabor -d sabor_caseiro"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://sabor:sabor_ci@localhost:5432/sabor_caseiro?schema=public
      PORT: 3333
      HOST: 0.0.0.0
      CORS_ORIGIN: http://127.0.0.1:5500
      ADMIN_EMAIL: admin@saborcaseiro.test
      ADMIN_PASSWORD: SaborCaseiro-CI-2026!
      JWT_SECRET: sabor-caseiro-ci-jwt-secret-change-me-123456

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push database schema
        run: npx prisma db push

      - name: Seed admin
        run: npx tsx prisma/seed/admin.ts

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test
