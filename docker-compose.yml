services:
  postgres:
    image: postgres:17-alpine
    container_name: sabor-caseiro-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sabor
      POSTGRES_PASSWORD: sabor_dev
      POSTGRES_DB: sabor_caseiro
    ports:
      - "5432:5432"
    volumes:
      - sabor_caseiro_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sabor -d sabor_caseiro"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  sabor_caseiro_pgdata:
